name: Deploy Demo

on:
  push:
    branches: [development]

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH and deploy demo
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host softone-prod
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'staticfiles' \
            --exclude '.DS_Store' \
            --exclude '.env' \
            --exclude 'deploy/cloudflared/*.json' \
            --exclude 'deploy/keys' \
            --exclude 'deploy/sites/lavonia/www' \
            ./ softone-prod:/opt/softone-demo/

          ssh softone-prod 'cd /opt/softone-demo && deploy/scripts/deploy-demo.sh'

      - name: Smoke demo
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://demo.softone360.com/healthz | grep -q ok \
              && curl -fsS -o /dev/null -w "%{http_code}" https://demo.softone360.com/login | grep -q 200 \
              && curl -fsS -o /dev/null -w "%{http_code}" "$(curl -fsS https://demo.softone360.com/login | grep -oE '/assets/index-[^"]+\.js' | head -1 | sed 's|^|https://demo.softone360.com|')" | grep -q 200; then
              echo "Demo smoke OK"
              exit 0
            fi
            echo "Esperando demo… intento $i"
            sleep 10
          done
          echo "ERROR: demo no respondió tras 60s" >&2
          exit 1
