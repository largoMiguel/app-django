<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias binding="same">
    <family>Verdana</family>
    <accept><family>DejaVu Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Tahoma</family>
    <accept><family>DejaVu Sans Condensed</family></accept>
  </alias>
  <alias binding="same">
    <family>Arial Narrow</family>
    <accept><family>Liberation Sans Narrow</family></accept>
  </alias>
  <alias binding="same">
    <family>Century Gothic</family>
    <accept><family>URW Gothic</family></accept>
  </alias>
  <alias binding="same">
    <family>Calibri</family>
    <accept><family>Carlito</family></accept>
  </alias>
  <alias binding="same">
    <family>Cambria</family>
    <accept><family>Caladea</family></accept>
  </alias>
  <alias binding="same">
    <family>Arial</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <accept><family>Liberation Serif</family></accept>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <accept><family>Liberation Mono</family></accept>
  </alias>
</fontconfig>
