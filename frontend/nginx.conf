server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Long cache for hashed assets
    location ~* \.(?:js|css|woff2?|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # face-api model weights
    location /models/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Páginas legales estáticas (HTML completo para revisores Google OAuth / crawlers)
    location = /privacidad {
        try_files /privacidad/index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /condiciones {
        try_files /condiciones/index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
