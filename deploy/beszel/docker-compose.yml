# Beszel — monitoreo del host y contenedores Docker (hub + agente local).
# Acceso web vía Cloudflare Tunnel: monitor.softone360.com → softone-beszel:8090
# El puerto 8090 solo se publica en 127.0.0.1 (agente en network_mode: host).
#
# Primer arranque: ver deploy/docs/beszel.md

name: beszel

services:
  beszel:
    image: henrygd/beszel:latest
    container_name: softone-beszel
    restart: unless-stopped
    environment:
      APP_URL: ${BESZEL_APP_URL:-https://monitor.softone360.com}
      # Opcional: ping externo si Beszel deja de reportar (Healthchecks.io, Uptime Kuma…)
      # HEARTBEAT_URL: ${BESZEL_HEARTBEAT_URL:-}
      # Con Cloudflare Access delante del hub (ver deploy/docs/beszel.md):
      # TRUSTED_AUTH_HEADER: Cf-Access-Authenticated-User-Email
      # TRUSTED_PROXY_IPS: 172.16.0.0/12
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    networks:
      - softone_edge
    security_opt:
      - no-new-privileges:true

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: softone-beszel-agent
    restart: unless-stopped
    network_mode: host
    depends_on:
      - beszel
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Discos relevantes para SoftOne (aparecen en la UI como /extra-filesystems/…)
      - /srv:/extra-filesystems/srv:ro
      - /var/backups:/extra-filesystems/backups:ro
      - /opt:/extra-filesystems/opt:ro
      - /var/lib/docker:/extra-filesystems/docker-data:ro
      - /opt/softone-app/logs:/extra-filesystems/softone-logs:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://127.0.0.1:8090
      TOKEN: ${BESZEL_AGENT_TOKEN:-}
      KEY: ${BESZEL_AGENT_KEY:-}
      SYSTEM_NAME: ${BESZEL_SYSTEM_NAME:-softone-prod}
      DOCKER_TIMEOUT: 5s
      # Contenedores efímeros / ruido (ajusta en la UI con alertas por nombre)
      # EXCLUDE_CONTAINERS: "buildx_*"
      # SMART del disco físico requiere devices en el compose; ver deploy/docs/beszel.md
    security_opt:
      - no-new-privileges:true

networks:
  softone_edge:
    external: true

volumes:
  beszel_data:
  beszel_agent_data:
  beszel_socket:
